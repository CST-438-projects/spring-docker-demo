# Local development stack. `docker compose up --build` builds the image from
# the Dockerfile in this folder and runs it.
#
# Naming: `docker compose` looks for compose.yaml first, then docker-compose.yml.
# The Project 02 rubric calls the file docker-compose.yml; either name works.
services:
  api:
    build: .
    image: hello-api:compose
    ports:
      - "8080:8080"          # host:container
    environment:
      APP_VERSION: compose   # shows up in GET /api/v1/hello
      # PORT is intentionally NOT set here: the app falls back to 8080.

