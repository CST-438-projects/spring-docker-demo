spring.application.name=hello-api

# Hosts such as Render inject PORT and route traffic to it. Locally there is no
# PORT, so we fall back to 8080. Spring binds to 0.0.0.0 by default, which is
# what a container needs.
server.port=${PORT:8080}

# Shown by GET /api/v1/hello so you can tell which build is running.
app.version=${APP_VERSION:dev}

# Only expose what we need. /actuator/health is what Docker and the host poll.
management.endpoints.web.exposure.include=health
